<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<title>Zeit</title>
<style>
:root{
  --bg:#000; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.12); --text:#f5f5f7; --dim:rgba(235,235,245,.6);
  --gold:#ffc457; --green:#32d74b; --red:#ff453a; --blue:#0a84ff; --accent:#0a84ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050508;color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none}
body::before{width:420px;height:420px;left:-200px;top:-120px;background:rgba(64,77,242,.26)}
body::after{width:380px;height:380px;right:-220px;top:300px;background:rgba(178,64,217,.2)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:30px;margin:6px 2px 14px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)} .small{font-size:13px} .big{font-size:34px;font-weight:700;letter-spacing:-1px}
.gold{color:var(--gold)} .green{color:var(--green)} .red{color:var(--red)}
button,.btn{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;
  padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button:active{opacity:.6}
button.primary{background:var(--accent);color:#fff;border-color:transparent}
button.danger{background:rgba(255,69,58,.18);color:var(--red);border-color:rgba(255,69,58,.4)}
button.block{display:block;width:100%}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;width:100%;outline:none}
select{appearance:none;-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.red>i{background:var(--red)} .bar.green>i{background:var(--green)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.box{width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;cursor:pointer;font-size:15px}
.box.done{background:var(--green);border-color:var(--green);color:#000}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--dim)}
.done-t{text-decoration:line-through;color:var(--dim)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(18,18,20,.82);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--line);z-index:5}
nav button{background:none;border:0;flex:1;font-size:11px;color:var(--dim);padding:6px 0;border-radius:10px}
nav button b{display:block;font-size:22px;font-weight:400;margin-bottom:1px}
nav button.on{color:var(--accent)}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
#focus{position:fixed;inset:0;z-index:15;background:#050508;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#lock{position:fixed;inset:0;z-index:20;background:#1a0000;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px}
#lock h1{font-size:34px;color:var(--red)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);
  background:#2c2c2e;border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:30;font-size:14px;
  max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.kv{display:flex;justify-content:space-between;padding:6px 0}
.hero{border-radius:24px;padding:20px 18px;margin-bottom:12px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(135deg,rgba(64,77,242,.55),rgba(178,64,217,.45)) center/cover;border:1px solid var(--line);position:relative;overflow:hidden}
.hero .q{font-size:21px;font-weight:700;line-height:1.2;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vg div{position:relative;aspect-ratio:1;border-radius:14px;background:center/cover;border:1px solid var(--line)}
.vg b{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:12px;cursor:pointer}
.gear{padding:6px 11px;font-size:18px;margin-top:2px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.pill.on{background:rgba(50,215,75,.18);color:var(--green)} .pill.off{background:rgba(255,255,255,.1);color:var(--dim)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg div{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:14px;cursor:pointer;color:var(--dim)}
.seg div.on{background:var(--card2);color:var(--text);font-weight:600}
a{color:var(--blue)}
</style>
</head>
<body>
<div id="app"></div>
<div id="lock"></div>
<div id="focus"></div>
<nav id="nav"></nav>

<script>
"use strict";
/* ---------- Konstanten ---------- */
const AREAS = ["CDNP","MySolv","Vintage","Job","Schule","Privat"];
const PRIOS = {hoch:20, mittel:10, niedrig:5};
const RANKS = [["Bronze",0],["Silber",100],["Gold",300],["Platin",700],["Diamant",1500],["Champion",3000],["Legende",6000]];
const GATE_WORK = 7200, GATE_TODOS = 3;               // 2 h Arbeit + 3 erledigte Aufgaben
const VIDEO_CAP = 10;                                  // harte Sperre pro Tag
const SOCIAL = {
  yt:{name:"YouTube",     icon:"▶️", budget:1800, penalty:6},
  ig:{name:"Instagram",   icon:"📸", budget:900,  penalty:2},
  tt:{name:"TikTok",      icon:"🎵", budget:900,  penalty:2},
};
const PASS_MAX = 2, PASS_BONUS = 900;                  // Arbeits-Freigabe: 2×/Tag, +15 min (nicht YouTube)
const PROFILE_URL = "Zeit-Filter.mobileconfig";

/* ---------- Speicher ---------- */
const KEY = "zeit.handy.v1";
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const month = () => today().slice(0,7);
function fresh(){ return { todos:[], days:{}, run:null, goals:{
  porsche:{target:900000, saved:0}, freedom:{target:10000, profit:0}, monthTarget:5000, months:{} }, area:"Alle", per:"today",
  sync:{token:"", repo:"chrismhn/zeit-daten", seen:null, shopOrders:null, snap:null, last:0, err:null, pushed:""} }; }
const DEFAULT_WHY = "Für Mama und meine Familie. Freiheit: arbeiten, wo ich will. 10.000 € Profit im Monat.";
/* Gespeicherte/importierte Daten auf Standardwerte auffüllen, damit nichts fehlt */
function normalize(o){
  const f=fresh(), s=Object.assign(f, (o&&typeof o==="object")?o:{});
  s.sync = Object.assign(fresh().sync, s.sync||{});
  s.goals = Object.assign(fresh().goals, s.goals||{});
  s.goals.porsche = Object.assign(fresh().goals.porsche, s.goals.porsche||{});
  s.goals.freedom = Object.assign(fresh().goals.freedom, s.goals.freedom||{});
  if(!Array.isArray(s.todos)) s.todos=[];
  if(!s.days||typeof s.days!=="object") s.days={};
  if(s.why===undefined) s.why=DEFAULT_WHY;
  return s;
}
let S; try{ S = normalize(JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ S = normalize({}); }
let saveWarned=false;
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){
  if(!saveWarned){ saveWarned=true; toast("Speicher voll – Änderungen werden nicht gesichert. Bitte Datei exportieren."); } } };
function day(k=today()){ return S.days[k] || (S.days[k] = {work:0, yt:0, ig:0, tt:0, videos:0, passes:0, passReasons:[], passOn:false}); }

/* ---------- Logik ---------- */
const doneToday = () => S.todos.filter(t=>t.done && t.doneAt===today()).length;
const todoPointsOn = k => S.todos.filter(t=>t.done && t.doneAt===k).reduce((a,t)=>a+t.points,0);
const totalXP = () => S.todos.filter(t=>t.done).reduce((a,t)=>a+t.points,0);
function rank(xp){ let i=0; RANKS.forEach((r,n)=>{ if(xp>=r[1]) i=n; }); const nx=RANKS[i+1];
  return {name:RANKS[i][0], i, next:nx?nx[1]:null, base:RANKS[i][1], nextName:nx?nx[0]:null}; }
function liveSec(kind){ const r=S.run; return (r && r.kind===kind) ? Math.floor((Date.now()-r.start)/1000) : 0; }
function secs(kind){ return day()[kind] + liveSec(kind); }
const gateOpen = () => secs("work")>=GATE_WORK && doneToday()>=GATE_TODOS;
function score(){
  const d=day(); let distraction=0;
  for(const k in SOCIAL) distraction += secs(k)/60 * SOCIAL[k].penalty;
  distraction += (day().leaveSec||0)/60;
  const raw = todoPointsOn(today()) + secs("work")/60/2 - distraction;
  return {value:Math.max(0,Math.min(100,Math.round(raw))), raw:Math.round(raw), distraction:Math.round(distraction)};
}
function budgetFor(k){ const d=day(); return SOCIAL[k].budget + ((k!=="yt" && d.passOn) ? PASS_BONUS : 0); }
function canStart(k){
  const d=day(), h=new Date().getHours();
  if(d.videos>=VIDEO_CAP) return "Heute gesperrt: "+VIDEO_CAP+" Videos erreicht.";
  if(k==="yt" && !gateOpen()) return "YouTube erst nach 2 h Arbeit und 3 erledigten Aufgaben.";
  if(k==="tt" && !(h>=18 && h<21)) return "TikTok nur zwischen 18 und 21 Uhr.";
  if(k==="tt" && !d.passOn) return "TikTok nur mit Arbeits-Freigabe (Influencer-Recherche, Antwort auf Nachrichten …).";
  if(secs(k)>=budgetFor(k)) return SOCIAL[k].name+": Tageslimit verbraucht.";
  return null;
}
function stopRun(reason){
  const r=S.run; if(!r) return;
  const used=Math.floor((Date.now()-r.start)/1000);
  const d=day(r.dayKey || today()); d[r.kind]=(d[r.kind]||0)+used; S.run=null; save(); if(typeof pushPhone==="function") pushPhone();
  if(reason==="limit") showLock(r.kind==="work"?"":SOCIAL[r.kind].name+" – Zeit ist um.");
}
function startRun(k){
  if(S.run) stopRun();
  if(k!=="work"){ const why=canStart(k); if(why){ toast(why); return; } }
  S.run={kind:k,start:Date.now(),dayKey:today()}; save(); render();
}
/* Limits prüfen (jede Sekunde) */
function enforce(){
  const r=S.run; if(!r) return;
  if(r.dayKey!==today()){ stopRun(); return; }                       // Tageswechsel
  if(r.kind==="work") return;
  const d=day();
  if(d.videos>=VIDEO_CAP || secs(r.kind)>=budgetFor(r.kind)) stopRun("limit");
}
function showLock(msg){
  const el=document.getElementById("lock");
  el.innerHTML='<div style="font-size:70px">⛔️</div><h1>Schluss.</h1><p style="font-size:19px">'+msg+
    '</p><p class="dim">Leg das Handy weg und mach die nächste Aufgabe.</p><button class="primary" id="lockok">Okay, zurück an die Arbeit</button>';
  el.style.display="flex"; document.getElementById("lockok").onclick=()=>{ el.style.display="none"; setTab("heute"); };
}

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };
const mins = s => Math.floor(s/60)+" min";
const eur = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
function toast(t){ const e=document.createElement("div"); e.className="toast"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),3200); }
let tab="heute"; function setTab(t){ tab=t; render(); window.scrollTo(0,0); }

/* ---------- Vision Board & Motivation (Fotos bleiben nur auf diesem Gerät) ---------- */
const QUOTES=["Erst fertig machen. Dann gucken.","Never miss a day.","Heute entscheidet, wer du in einem Jahr bist.","Disziplin schlägt Motivation. Jeden Tag.","Erst die Arbeit. Dann der Porsche.","Kleine Schritte, jeden Tag, ohne Ausnahme.","Wer heute scrollt, zahlt morgen.","Eine erledigte Aufgabe ist mehr wert als zehn Pläne.","Du hast es dir versprochen. Halte es.","Fokus ist die neue Superkraft.","Nicht fühlen. Machen.","Dein zukünftiges Ich schaut zu.","Umsatz kommt von Handlung, nicht von Hoffnung.","Zwei Stunden Arbeit. Dann darfst du Pause.","Der Weg zum Ziel ist langweilig. Genau deshalb gewinnst du.","Heute 1 % besser reicht.","Mach die Aufgabe, vor der du dich drückst."];
const VKEY="zeit.vision.imgs";
const SEED_VIS=[2,3,4,6,7,8,9,10,11].map(n=>"vis/p"+n+".jpg");
let VIMGS=SEED_VIS.slice(); try{ const l=JSON.parse(localStorage.getItem(VKEY)||"null"); if(Array.isArray(l)) VIMGS=l; }catch(e){}
const visionImgs=()=>VIMGS;
function setVision(l){ VIMGS=l; try{ localStorage.setItem(VKEY,JSON.stringify(l)); }catch(e){ toast("Speicher voll, bitte ein Bild entfernen."); } }
const dayIdx=()=>Math.floor(Date.now()/864e5);
function shrink(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej;
  im.onload=()=>{ const m=720, k=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.72)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
function heroCard(){
  const imgs=visionImgs(), pic=imgs.length?imgs[dayIdx()%imgs.length]:null, p=S.goals.porsche, pp=Math.min(100,p.saved/p.target*100);
  const q=(S.why&&S.why.trim())||QUOTES[dayIdx()%QUOTES.length];
  return `<div class="hero" style="${pic?`background-image:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.82) 100%),url(${pic})`:''}">
    <div class="q">${esc(q)}</div>
    <div class="kv small" style="margin-top:12px"><span>Freiheit · Profit pro Monat</span><b>${eur(S.goals.freedom.profit)} / ${eur(S.goals.freedom.target)}</b></div>
    <div class="bar"><i style="width:${Math.max(1,Math.min(100,S.goals.freedom.profit/S.goals.freedom.target*100))}%"></i></div>
    <div class="kv small" style="margin-top:10px"><span>Porsche 911 Turbo S</span><b>${eur(p.saved)} / ${eur(p.target)}</b></div>
    <div class="bar"><i style="width:${Math.max(1,pp)}%;background:var(--gold)"></i></div></div>`;
}
function visionCard(){
  const imgs=visionImgs();
  return `<h2>Vision Board</h2><div class="card">
    ${imgs.length?`<div class="vg">${imgs.map((u,i)=>`<div style="background-image:url(${u})"><b data-act="vdel" data-i="${i}">✕</b></div>`).join("")}</div>`:'<span class="dim small">Noch keine Bilder. Füge Fotos von dem hinzu, wofür du arbeitest.</span>'}
    <label class="btn block" style="margin-top:12px">+ Fotos hinzufügen<input id="vis" type="file" accept="image/*" multiple style="display:none"></label>
    <textarea id="why" rows="2" placeholder="Mein Warum (steht oben als Motivation)" style="margin-top:10px">${esc(S.why||"")}</textarea>
    <button class="block" data-act="why" style="margin-top:8px">Speichern</button></div>`;
}

/* ---------- Tabs ---------- */
function vHeute(){
  const sc=score(), xp=totalXP(), rk=rank(xp), d=day(), run=S.run;
  const C=2*Math.PI*62, off=C*(1-sc.value/100);
  const gw=Math.min(1,secs("work")/GATE_WORK), gt=Math.min(1,doneToday()/GATE_TODOS);
  const open=S.todos.filter(t=>!t.done && !t.archived);
  const order={hoch:0,mittel:1,niedrig:2};
  open.sort((a,b)=>order[a.prio]-order[b.prio] || a.created-b.created);
  const focus=open[0];
  const rp = rk.next ? Math.round((xp-rk.base)/(rk.next-rk.base)*100) : 100;
  return head("Heute")+heroCard()+`
  <div class="card row">
    <div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="62" stroke="rgba(255,255,255,.12)" stroke-width="12" fill="none"/>
      <circle cx="75" cy="75" r="62" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
      <div class="c"><div><div class="big">${sc.value}</div><div class="dim small">von 100</div></div></div></div>
    <div class="grow small">
      <div class="kv"><span class="dim">Aufgaben</span><b>+${todoPointsOn(today())}</b></div>
      <div class="kv"><span class="dim">Arbeit</span><b>+${Math.round(secs("work")/120)}</b></div>
      <div class="kv"><span class="dim">Ablenkung</span><b class="red">−${sc.distraction}</b></div>
    </div>
  </div>

  <div class="card">
    <div class="row"><div class="grow"><b>${rk.name}</b> <span class="dim small">· ${xp} Punkte gesamt</span></div>
      <span class="dim small">${rk.nextName?"→ "+rk.nextName:"Höchster Rang"}</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${rp}%"></i></div>
    <div class="dim small" style="margin-top:6px">Punkte gibt es nur für erledigte Aufgaben.</div>
  </div>

  ${(()=>{ const t=revenue("today"), m=revenue("month"); return t&&m?`<div class="card row" data-tab="umsatz" style="cursor:pointer"><div class="grow"><div class="dim small">Umsatz heute</div><div class="big">${eur(t.total)}</div></div><div style="text-align:right"><div class="dim small">30 Tage</div><b>${eur(m.total)}</b></div></div>`:""; })()}

  <h2>Arbeits-Timer</h2>
  <div class="card">
    <div class="row"><div class="grow"><div class="big" id="liveWork">${fmt(secs("work"))}</div><div class="dim small">heute gearbeitet</div></div>
      ${run&&run.kind==="work" ? '<button class="danger" data-act="stop">Stopp</button>' : '<button class="primary" data-act="start" data-k="work">Arbeit starten</button>'}</div>
  </div>

  <h2>Pause &amp; YouTube freischalten</h2>
  <div class="card">
    <div class="kv"><span>2 h Arbeit</span><b>${Math.floor(secs("work")/60)} / 120 min</b></div>
    <div class="bar ${gw>=1?'green':''}"><i style="width:${gw*100}%"></i></div>
    <div class="kv" style="margin-top:8px"><span>3 Aufgaben</span><b>${doneToday()} / ${GATE_TODOS}</b></div>
    <div class="bar ${gt>=1?'green':''}"><i style="width:${gt*100}%"></i></div>
    <p class="small ${gateOpen()?'green':'dim'}" style="margin:12px 0 0">${gateOpen()?"✓ Pause ist verdient. YouTube: 30 min.":"Noch nicht verdient. Erst arbeiten."}</p>
  </div>

  <h2>Jetzt dran</h2>
  <div class="card">${focus ? `<div class="row"><div class="box" data-act="done" data-id="${focus.id}"></div>
      <div class="grow"><b>${esc(focus.title)}</b><div class="small dim">${focus.area} · ${focus.prio} · +${focus.points} Punkte</div></div></div>`
    : '<span class="dim">Keine offene Aufgabe. Unter „Aufgaben“ neue anlegen.</span>'}</div>`+visionCard();
}

function vAufgaben(){
  const list=S.todos.filter(t=>!t.archived && (S.area==="Alle"||t.area===S.area));
  const open=list.filter(t=>!t.done), done=list.filter(t=>t.done).sort((a,b)=>b.doneAt>a.doneAt?1:-1).slice(0,15);
  const order={hoch:0,mittel:1,niedrig:2};
  open.sort((a,b)=>order[a.prio]-order[b.prio] || a.created-b.created);

/* ---------- Abgleich mit dem Mac über privaten GitHub-Speicher ---------- */
const gh = () => ({Authorization:"Bearer "+S.sync.token, Accept:"application/vnd.github+json"});
/* Eingaben säubern: Handy-Einfügen bringt oft Leerzeichen, Umbrüche, Anführungszeichen oder die ganze GitHub-URL mit */
const cleanToken = t => String(t||"").replace(/^(authorization:)?\s*(bearer|token)\s+/i,"").replace(/[\s"'“”‘’`]/g,"");
const cleanRepo = r => String(r||"").trim().replace(/^https?:\/\/(www\.)?github\.com\//i,"").replace(/\.git$/i,"").replace(/^\/+|\/+$/g,"");
/* Genau sagen, was an der Verbindung falsch ist (GitHub meldet bei fehlendem Zugriff nur „404") */
async function checkConnection(){
  const c=S.sync;
  if(!/^[\w.-]+\/[\w.-]+$/.test(c.repo||"")) return "Repo muss so aussehen: Benutzer/Repo (z. B. chrismhn/zeit-daten).";
  let r;
  try{ r=await fetch("https://api.github.com/repos/"+c.repo,{headers:gh(),cache:"no-store"}); }
  catch(e){ return "Keine Verbindung zu GitHub (Internet prüfen)."; }
  if(r.status===401) return "Schlüssel ungültig oder abgelaufen. Neu erstellen und komplett einfügen.";
  if(r.status===403) return "Schlüssel gesperrt (403) – evtl. Rate-Limit oder fehlende Berechtigung.";
  if(r.status===404) return "Repo „"+c.repo+"“ nicht gefunden – oder der Schlüssel hat keinen Zugriff darauf. Beim Erstellen genau dieses Repo auswählen.";
  if(!r.ok) return "GitHub-Fehler "+r.status;
  try{ const j=await r.json(); if(j.permissions && j.permissions.push===false) return "Schlüssel darf nur lesen. Contents auf „Read and write“ stellen, sonst kommen die Handy-Zeiten nicht zurück."; }catch(e){}
  return null;
}
async function fetchSnap(){
  const c=S.sync; let snap=null;
  try{
    if(c.token){
      const r=await fetch("https://api.github.com/repos/"+c.repo+"/contents/snapshot.json",{headers:{...gh(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});
      if(!r.ok){ const why=await checkConnection();
        if(why) throw new Error(why);
        if(r.status===404){ c.err=null; c.waiting=true; save(); return; }          // Verbindung ok, Mac hat nur noch nichts hochgeladen
        throw new Error("Fehler "+r.status); }
      snap=await r.json(); c.err=null; c.waiting=false;
    } else { const r=await fetch("snapshot.json",{cache:"no-store"}); if(r.ok) snap=await r.json(); }
  }catch(e){ c.err=String(e.message||e); }
  if(snap){
    const ids=((snap.resale||{}).recent||[]).map(x=>x.id), orders=(snap.shopify||[]).reduce((a,x)=>a+((x.month||{}).orders||0),0);
    if(c.seen){ ids.filter(i=>!c.seen.includes(i)).forEach(i=>{ const x=snap.resale.recent.find(y=>y.id===i);
        toast("💰 Neuer Verkauf: "+(PLAT[x.platform]||x.platform)+" +"+eur(x.price)); if(navigator.vibrate) navigator.vibrate(200); });
      if(c.shopOrders!==null && orders>c.shopOrders) toast("💰 Neue Shop-Bestellung"); }
    c.seen=ids; c.shopOrders=orders; c.snap=snap; c.last=Date.now();
  }
  save(); if(["heute","umsatz","agenten","mehr"].includes(tab) && !document.activeElement.matches("input,textarea,select")) render();
}
/* Handy-Zeiten zurück an den Mac (Desktop-App zeigt sie bei „Handy“ und im Tagesziel) */
async function pushPhone(){
  const c=S.sync; if(!c.token) return;
  const days={}; Object.keys(S.days).sort().slice(-7).forEach(k=>{ const d=S.days[k]; days[k]={work:d.work,yt:d.yt,ig:d.ig,tt:d.tt,videos:d.videos,leaves:d.leaves||0,giveups:d.giveups||0}; });
  if(S.run){ const d=days[today()]||(days[today()]={work:0,yt:0,ig:0,tt:0,videos:0}); d[S.run.kind]+=liveSec(S.run.kind); }
  const body=JSON.stringify({device:"Zeit-Handy-App",days}); if(body===c.pushed) return;
  const url="https://api.github.com/repos/"+c.repo+"/contents/phone.json";
  try{
    const g=await fetch(url,{headers:gh(),cache:"no-store"}); const sha=g.ok?(await g.json()).sha:undefined;
    const r=await fetch(url,{method:"PUT",headers:gh(),body:JSON.stringify({message:"Handy",content:btoa(unescape(encodeURIComponent(body))),sha})});
    if(r.ok){ c.pushed=body; c.err=null; }
    else c.err = (r.status===403||r.status===404||r.status===401) ? (await checkConnection()||"Schlüssel darf nicht schreiben (Contents: Read and write nötig).") : "Senden fehlgeschlagen ("+r.status+")";
  }catch(e){ c.err="Senden fehlgeschlagen (kein Netz?)"; }
  save();
}

const TABS=[["heute","◐","Heute"],["umsatz","€","Umsatz"],["agenten","✦","Agenten"],["aufgaben","☑︎","Aufgaben"],["sperren","⛔︎","Sperren"]];

/* Bildschirm während der Arbeit anlassen – sonst zählt die Auto-Sperre als „weggewechselt" und kostet Punkte */
let wl=null, wlBusy=false;
async function wakeSync(){
  if(wlBusy || !navigator.wakeLock) return; wlBusy=true;
  try{
    const need = !!(S.run && S.run.kind==="work") && !document.hidden;
    if(need && !wl){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{ wl=null; }); }
    else if(!need && wl){ await wl.release(); wl=null; }
  }catch(e){ wl=null; }
  wlBusy=false;
}

  const views={heute:vHeute,umsatz:vUmsatz,agenten:vAgenten,aufgaben:vAufgaben,sperren:vSperren,mehr:vMehr};

  focusOverlay(); wakeSync();
}

/* ---------- Aktionen ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){ setTab(tb.dataset.tab); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="start") startRun(el.dataset.k);
  else if(a==="stop"){ if(S.run&&S.run.kind==="work"&&liveSec("work")<1500) giveUp(); else { stopRun(); render(); } }
  else if(a==="area"){ S.area=el.dataset.a; save(); render(); }
  else if(a==="add"){ const t=$("#nt").value.trim(); if(!t){ toast("Titel fehlt."); return; }
    const prio=$("#np").value; S.todos.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:t,area:$("#na").value,prio,points:PRIOS[prio],done:false,created:Date.now()}); save(); render(); }
  else if(a==="done"){ const t=S.todos.find(x=>x.id===id); if(!t) return;
    t.done=!t.done; t.doneAt=t.done?today():null; save(); render(); if(t.done) toast("+"+t.points+" Punkte"); }
  else if(a==="arch"){ const t=S.todos.find(x=>x.id===id); if(t){ t.archived=true; save(); render(); } }
  else if(a==="video"){ const d=day(); d.videos++; save(); if(d.videos>=VIDEO_CAP){ stopRun("limit"); } render(); }
  else if(a==="pass"){ const d=day(), r=$("#pr").value.trim();
    if(r.length<10){ toast("Bitte einen echten Grund angeben (mind. 10 Zeichen)."); return; }
    if(d.passes>=PASS_MAX) return; d.passes++; d.passOn=true; d.passReasons.push(r); save(); render(); toast("Freigabe aktiv."); }
  else if(a==="porsche"){ const v=parseFloat($("#ps").value); if(isNaN(v)) return; S.goals.porsche.saved=Math.max(0,v); save(); render(); }
  else if(a==="freedom"){ const v=parseFloat($("#fp").value); if(isNaN(v)) return; S.goals.freedom.profit=Math.max(0,v); save(); render(); }
  else if(a==="mtarget"){ const v=parseFloat($("#mt").value); if(isNaN(v)) return; S.goals.monthTarget=Math.max(5000,v); save(); render(); if(v<5000) toast("Mindestens 5.000 €."); }
  else if(a==="vdel"){ const l=visionImgs().slice(); l.splice(+el.dataset.i,1); setVision(l); render(); }
  else if(a==="why"){ S.why=$("#why").value; save(); render(); toast("Gespeichert."); }
  else if(a==="per"){ S.per=el.dataset.p; save(); render(); }
  else if(a==="connect"){ const t=cleanToken($("#tok").value), r=cleanRepo($("#repo").value);
    if(r) S.sync.repo=r; if(t) S.sync.token=t;
    if(!S.sync.token){ toast("Bitte den Zugangsschlüssel einfügen."); return; }
    S.sync.seen=null; S.sync.err=null; S.sync.waiting=false; save(); toast("Verbinde …");
    fetchSnap().then(()=>pushPhone()).then(()=>{ render(); toast(S.sync.err ? "✗ "+S.sync.err : S.sync.snap ? "✓ Verbunden." : "✓ Verbunden. Warte auf den ersten Upload vom Mac."); }); }
  else if(a==="disconnect"){ S.sync.token=""; S.sync.snap=null; S.sync.seen=null; S.sync.err=null; S.sync.waiting=false; save(); render(); }
  else if(a==="export"){
    const out=JSON.parse(JSON.stringify(S)); out.sync={repo:S.sync.repo}; out._vision=VIMGS;   // Schlüssel & Mac-Daten nie in die Sicherung
    const b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"}), u=URL.createObjectURL(b), l=document.createElement("a");
    l.href=u; l.download="zeit-sicherung-"+today()+".json"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
  else if(a==="reset"){ if(confirm("Wirklich ALLE Daten auf diesem Gerät löschen? Das geht nicht rückgängig.")){ S=normalize({}); save(); render(); } }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="vis"){ const l=visionImgs().slice();
    for(const f of [...e.target.files].slice(0,12)){ try{ l.push(await shrink(f)); }catch(x){} }
    setVision(l.slice(-16)); render(); return; }
  if(e.target.id==="imp"){ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.todos||!o.days) throw 0;
      const keep=S.sync, vis=Array.isArray(o._vision)?o._vision:null; delete o._vision;
      S=normalize(o); S.sync=keep;                       // eigener Schlüssel bleibt, Sicherung enthält keinen
      if(vis) setVision(vis);
      save(); render(); toast("Importiert."); }catch(x){ toast("Datei passt nicht."); } };
    r.readAsText(f); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="nt"){ document.querySelector('[data-act="add"]').click(); }});

/* Live-Ticker */
setInterval(()=>{
  enforce();
  const r=S.run; if(!r) return;
  const w=$("#liveWork"); if(w && r.kind==="work") w.textContent=fmt(secs("work"));
  const ft=$("#focusT"); if(ft && r.kind==="work") ft.textContent=fmt(liveSec("work"));
  const s=$("#liveSoc"); if(s && r.kind!=="work") s.textContent=fmt(liveSec(r.kind));
},1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ enforce(); render(); } });

fetchSnap(); pushPhone();
setInterval(()=>{ if(!document.hidden){ fetchSnap(); pushPhone(); } },60000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pushPhone(); else fetchSnap(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
